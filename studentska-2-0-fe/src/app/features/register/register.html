<div class="register-container">
	<mat-card appearance="outlined">
		<mat-card-header>
			<mat-card-title>Registracija</mat-card-title>
			<mat-card-subtitle>Kreirajte Vaš nalog</mat-card-subtitle>
		</mat-card-header>
		<mat-card-content>
			<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
				<div class="row">
					<app-form-field 
						[control]="form.controls.ime"
						label="Ime"
						fieldName="ime"
						[required]="true"
						[serverErrors]="serverErrors()"
						[errorMessages]="{
							'required': 'Ime je obavezno.',
							'maxlength': 'Ime može imati najviše 100 karaktera.'
						}">
					</app-form-field>

					<app-form-field 
						[control]="form.controls.prezime"
						label="Prezime"
						fieldName="prezime"
						[required]="true"
						[serverErrors]="serverErrors()"
						[errorMessages]="{
							'required': 'Prezime je obavezno.',
							'maxlength': 'Prezime može imati najviše 100 karaktera.'
						}">
					</app-form-field>
				</div>

				<app-form-field 
					[control]="form.controls.broj_indeksa"
					label="Broj indeksa"
					fieldName="broj_indeksa"
					[required]="true"
					[serverErrors]="serverErrors()"
					[errorMessages]="{
						'required': 'Broj indeksa je obavezan.',
						'maxlength': 'Broj indeksa može imati najviše 50 karaktera.'
					}">
				</app-form-field>

				<app-form-field 
					[control]="form.controls.email"
					label="Email"
					type="email"
					fieldName="email"
					[required]="true"
					[serverErrors]="serverErrors()"
					[errorMessages]="{
						'required': 'Email je obavezan.',
						'email': 'Unesite validan email.'
					}">
				</app-form-field>

				<div class="row">
					<app-form-field 
						[control]="form.controls.password"
						label="Lozinka"
						type="password"
						fieldName="password"
						[required]="true"
						[serverErrors]="serverErrors()"
						[errorMessages]="{
							'required': 'Lozinka je obavezna.',
							'minlength': 'Lozinka mora imati najmanje 8 karaktera.'
						}">
					</app-form-field>

					<app-form-field 
						[control]="form.controls.password_confirmation"
						label="Potvrda lozinke"
						type="password"
						fieldName="password_confirmation"
						[required]="true"
						[serverErrors]="serverErrors()"
						[errorMessages]="{
							'required': 'Potrebno je potvrditi lozinku.'
						}">
					</app-form-field>
				</div>
			</form>
		</mat-card-content>
		<mat-card-actions align="end">
			<a mat-button routerLink="/o-nama" appHighlight [highlightColor]="'#f0f4ff'">O nama</a>
			<app-action-button 
				text="Registruj se"
				type="submit"
				variant="raised"
				color="primary"
				icon="person_add"
				loadingText="Registracija u toku..."
				[loading]="submitting()"
				[disabled]="form.invalid"
				(clicked)="onSubmit()">
			</app-action-button>
		</mat-card-actions>
		<a mat-button routerLink="/login" appHighlight [highlightColor]="'#f0f4ff'">Već imaš nalog? Prijavi se</a>
	</mat-card>
</div>
