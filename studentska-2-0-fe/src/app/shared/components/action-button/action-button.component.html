<!-- Basic Button -->
@if (variant() === 'basic') {
  <button 
    mat-button
    [type]="type()"
    [color]="color()"
    [disabled]="isDisabled()"
    [class]="getSizeClass()"
    (click)="onClick($event)">
    <div class="button-content">
      @if (loading()) {
        <mat-spinner diameter="18" color="primary"></mat-spinner>
      } @else if (icon() && iconPosition() === 'left') {
        <mat-icon>{{ icon() }}</mat-icon>
      }
      <span class="button-text">{{ getDisplayText() }}</span>
      @if (!loading() && icon() && iconPosition() === 'right') {
        <mat-icon>{{ icon() }}</mat-icon>
      }
    </div>
  </button>
}
